<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 · 手机端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue-600: #1677ff;
    --blue-700: #0d5bd6;
    --blue-50:  #f0f6ff;
    --blue-100: #dbe9ff;
    --line:     #e4eaf3;
    --text:     #1a2233;
    --text-2:   #6b7788;
    --bg:       #eef2f8;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    width: 320px;
    height: 640px;
    background: #0b1220;
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 24px 60px rgba(16, 42, 89, .28), 0 2px 6px rgba(16, 42, 89, .12);
    position: relative;
  }
  .phone::after {
    content: "";
    position: absolute;
    left: 50%; top: 20px;
    transform: translateX(-50%);
    width: 92px; height: 22px;
    background: #0b1220;
    border-radius: 999px;
    z-index: 5;
  }
  .phone-screen {
    width: 100%; height: 100%;
    background: #fff;
    border-radius: 32px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #2b86ff 0%, #0d5bd6 100%);
  }
  .status-bar .dots { display: flex; gap: 5px; align-items: center; }
  .status-bar .dots i { display: block; background: #fff; border-radius: 2px; }
  .status-bar .dots i:nth-child(1){ width: 3px; height: 6px; opacity:.6 }
  .status-bar .dots i:nth-child(2){ width: 3px; height: 8px; opacity:.8 }
  .status-bar .dots i:nth-child(3){ width: 3px; height: 10px; }
  .status-bar .bat {
    width: 20px; height: 10px; border: 1.4px solid #fff; border-radius: 3px;
    position: relative; opacity: .95;
  }
  .status-bar .bat::before {
    content:""; position:absolute; inset:2px; right:5px; background:#fff; border-radius:1px;
  }

  .app-nav {
    background: linear-gradient(135deg, #2b86ff 0%, #0d5bd6 100%);
    padding: 4px 16px 20px;
    display: flex;
    align-items: center;
    color: #fff;
  }
  .app-nav .back {
    font-size: 22px;
    line-height: 1;
    width: 28px;
    opacity: .9;
    cursor: pointer;
  }
  .app-nav .nav-title {
    flex: 1;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .5px;
    margin-right: 28px;
  }

  .app-body {
    flex: 1;
    background: #f7f9fc;
    padding: 0 16px 20px;
    overflow-y: auto;
  }

  .notice {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--blue-50);
    border: 1px solid var(--blue-100);
    border-left: 3px solid var(--blue-600);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 13px;
    color: var(--blue-700);
    font-weight: 500;
    line-height: 1.4;
    margin-top: 16px;
  }
  .notice svg { flex: none; }

  .form-card {
    background: #fff;
    border-radius: 14px;
    padding: 18px 16px 20px;
    margin-top: 14px;
    box-shadow: 0 4px 16px rgba(16, 42, 89, .06);
  }

  .field { margin-bottom: 16px; }
  .field:last-of-type { margin-bottom: 22px; }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-2);
    margin-bottom: 7px;
    font-weight: 500;
  }
  .field label .req { color: #e5484d; margin-left: 2px; }

  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    height: 44px;
    padding: 0 42px 0 13px;
    font-size: 15px;
    color: var(--text);
    background: #f7f9fc;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: .18s;
    font-family: inherit;
    letter-spacing: .5px;
  }
  .input-wrap input::placeholder { color: #a8b2c0; letter-spacing: 0; }
  .input-wrap input:focus {
    background: #fff;
    border-color: var(--blue-600);
    box-shadow: 0 0 0 3px rgba(22, 119, 255, .12);
  }

  .eye {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    cursor: pointer;
    color: #a8b2c0;
    display: flex; align-items: center; justify-content: center;
  }
  .eye:hover { color: var(--blue-600); }

  .btn-primary {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2b86ff 0%, #0d5bd6 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 6px 16px rgba(22, 119, 255, .3);
    transition: .18s;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary:active { transform: translateY(1px); box-shadow: 0 3px 10px rgba(22,119,255,.3); }

  .foot-tip {
    text-align: center;
    font-size: 12px;
    color: #9aa5b4;
    margin-top: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="phone-screen">

      <div class="status-bar">
        <span>9:41</span>
        <div class="dots"><i></i><i></i><i></i><span class="bat"></span></div>
      </div>

      <div class="app-nav">
        <div class="back">‹</div>
        <div class="nav-title">修改密码</div>
      </div>

      <div class="app-body">

        <div class="notice">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16.5h.01"/>
          </svg>
          <span>每月1日自动下线重置密码</span>
        </div>

        <div class="form-card">

          <div class="field">
            <label>旧密码<span class="req">*</span></label>
            <div class="input-wrap">
              <input type="password" placeholder="请输入旧密码">
              <div class="eye">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="field">
            <label>新密码<span class="req">*</span></label>
            <div class="input-wrap">
              <input type="password" placeholder="请输入新密码">
              <div class="eye">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="field">
            <label>确认新密码<span class="req">*</span></label>
            <div class="input-wrap">
              <input type="password" placeholder="请再次输入新密码">
              <div class="eye">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </div>
            </div>
          </div>

          <button class="btn-primary">确认修改</button>

        </div>

        <div class="foot-tip">修改成功后，其他设备将自动退出登录</div>

      </div>
    </div>
  </div>

</body>
</html>
