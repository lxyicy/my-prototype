<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 · 网页端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue-600: #1677ff;
    --blue-700: #0d5bd6;
    --blue-50:  #f0f6ff;
    --blue-100: #dbe9ff;
    --line:     #e4eaf3;
    --text:     #1a2233;
    --text-2:   #6b7788;
    --bg:       #eef2f8;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f5f8ff;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }

  .desktop-card {
    width: 400px;
    background: #fff;
    border-radius: 16px;
    padding: 36px 36px 30px;
    box-shadow: 0 10px 40px rgba(16, 42, 89, .12);
    border: 1px solid rgba(16,42,89,.05);
  }

  .desktop-card h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 6px;
  }
  .desktop-sub {
    font-size: 13px;
    color: var(--text-2);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .notice {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--blue-50);
    border: 1px solid var(--blue-100);
    border-left: 3px solid var(--blue-600);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 13px;
    color: var(--blue-700);
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 24px;
  }
  .notice svg { flex: none; }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-2);
    margin-bottom: 7px;
    font-weight: 500;
  }
  .field label .req { color: #e5484d; margin-left: 2px; }

  .input-wrap { position: relative; }
  .input-wrap input {
    width: 100%;
    height: 46px;
    padding: 0 44px 0 14px;
    font-size: 15px;
    color: var(--text);
    background: #f7f9fc;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: .18s;
    font-family: inherit;
    letter-spacing: .5px;
  }
  .input-wrap input::placeholder { color: #a8b2c0; letter-spacing: 0; }
  .input-wrap input:focus {
    background: #fff;
    border-color: var(--blue-600);
    box-shadow: 0 0 0 3px rgba(22, 119, 255, .12);
  }

  .eye {
    position: absolute;
    right: 13px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    cursor: pointer;
    color: #a8b2c0;
    display: flex; align-items: center; justify-content: center;
  }
  .eye:hover { color: var(--blue-600); }

  .btn-primary {
    width: 100%;
    height: 48px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2b86ff 0%, #0d5bd6 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 6px 18px rgba(22, 119, 255, .3);
    transition: .18s;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary:active { transform: translateY(1px); box-shadow: 0 3px 10px rgba(22,119,255,.3); }

  .desktop-foot {
    text-align: center;
    font-size: 12px;
    color: #9aa5b4;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <div class="desktop-card">

    <h1>修改密码</h1>
    <div class="desktop-sub">密码已过期，请修改后继续使用</div>

    <div class="notice">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v5"/><path d="M12 16.5h.01"/>
      </svg>
      <span>每月1日自动下线重置密码</span>
    </div>

    <div class="field">
      <label>旧密码<span class="req">*</span></label>
      <div class="input-wrap">
        <input type="password" placeholder="请输入旧密码">
        <div class="eye">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="field">
      <label>新密码<span class="req">*</span></label>
      <div class="input-wrap">
        <input type="password" placeholder="请输入新密码">
        <div class="eye">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="field">
      <label>确认新密码<span class="req">*</span></label>
      <div class="input-wrap">
        <input type="password" placeholder="请再次输入新密码">
        <div class="eye">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
      </div>
    </div>

    <button class="btn-primary">确认修改</button>

    <div class="desktop-foot">修改成功后，其他设备将自动退出登录</div>

  </div>

</body>
</html>
